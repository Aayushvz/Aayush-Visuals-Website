<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" fill="#1a1a1a">
  <!-- Government of India - simplified Ashoka emblem + text -->
  <g transform="translate(5, 2)">
    <!-- Simplified Ashoka Lion Capital -->
    <!-- Base/abacus -->
    <rect x="10" y="58" width="50" height="5" rx="1"/>
    <rect x="14" y="53" width="42" height="6" rx="1"/>
    <!-- Pillar -->
    <rect x="20" y="20" width="30" height="34" rx="2"/>
    <!-- Lion heads (simplified as a crown shape) -->
    <path d="M22 20 L18 10 Q20 6 25 4 L35 0 L45 4 Q50 6 52 10 L48 20 Z"/>
    <!-- Wheel on pillar -->
    <circle cx="35" cy="38" r="8" fill="none" stroke="#fff" stroke-width="1.5"/>
    <circle cx="35" cy="38" r="2" fill="#fff"/>
    <!-- Spokes -->
    <line x1="35" y1="30" x2="35" y2="46" stroke="#fff" stroke-width="0.8"/>
    <line x1="27" y1="38" x2="43" y2="38" stroke="#fff" stroke-width="0.8"/>
    <line x1="29.3" y1="32.3" x2="40.7" y2="43.7" stroke="#fff" stroke-width="0.8"/>
    <line x1="40.7" y1="32.3" x2="29.3" y2="43.7" stroke="#fff" stroke-width="0.8"/>
  </g>
  <!-- Text -->
  <text x="80" y="32" font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" font-weight="600" fill="#1a1a1a">GOVERNMENT</text>
  <text x="80" y="56" font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="18" font-weight="600" fill="#1a1a1a">OF INDIA</text>
</svg>