  <rect x="55" y="70" width="70" height="12" rx="2"/>
  <!-- Sun rays at top -->
  <line x1="90" y1="35" x2="90" y2="45" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="75" y1="40" x2="80" y2="48" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="105" y1="40" x2="100" y2="48" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="65" y1="48" x2="72" y2="54" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="115" y1="48" x2="108" y2="54" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Book at bottom -->
  <path d="M60 150 Q75 142 90 150 Q105 142 120 150 L120 175 Q105 167 90 175 Q75 167 60 175 Z" fill="none" stroke="#1a1a1a" stroke-width="2"/>
