<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" fill="#1a1a1a">
  <!-- VIT Vellore - detailed monochrome seal -->
  <!-- Outer circle border -->
  <circle cx="100" cy="95" r="94" fill="none" stroke="#1a1a1a" stroke-width="3.5"/>
  <circle cx="100" cy="95" r="86" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Text band area between circles -->
  <path id="topTextPath" d="M 20,95 A 80,80 0 0,1 180,95" fill="none"/>
  <text font-family="'Times New Roman', Georgia, serif" font-size="12" font-weight="700" fill="#1a1a1a" letter-spacing="3">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">VELLORE INSTITUTE OF TECHNOLOGY</textPath>
  </text>

  <!-- Inner circle -->
  <circle cx="100" cy="95" r="62" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- VIT text prominently centered -->
  <text x="100" y="78" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="38" font-weight="700" fill="#1a1a1a">VIT</text>

  <!-- Temple/campus silhouette -->
  <g opacity="0.9">
    <!-- Temple tower -->
    <polygon points="80,82 85,62 90,82"/>
    <rect x="83" y="62" width="4" height="3"/>
    <!-- Building blocks -->
    <rect x="60" y="88" width="80" height="3"/>
    <rect x="55" y="92" width="90" height="12" rx="1"/>
    <!-- Brick pattern -->
    <line x1="60" y1="95" x2="140" y2="95" stroke="#fff" stroke-width="0.5"/>
    <line x1="60" y1="98" x2="140" y2="98" stroke="#fff" stroke-width="0.5"/>
    <line x1="60" y1="101" x2="140" y2="101" stroke="#fff" stroke-width="0.5"/>
    <line x1="70" y1="92" x2="70" y2="104" stroke="#fff" stroke-width="0.5"/>
    <line x1="80" y1="92" x2="80" y2="104" stroke="#fff" stroke-width="0.5"/>
    <line x1="90" y1="92" x2="90" y2="104" stroke="#fff" stroke-width="0.5"/>
    <line x1="100" y1="92" x2="100" y2="104" stroke="#fff" stroke-width="0.5"/>
    <line x1="110" y1="92" x2="110" y2="104" stroke="#fff" stroke-width="0.5"/>
    <line x1="120" y1="92" x2="120" y2="104" stroke="#fff" stroke-width="0.5"/>
    <line x1="130" y1="92" x2="130" y2="104" stroke="#fff" stroke-width="0.5"/>
    <!-- Tree silhouettes -->
    <ellipse cx="55" cy="82" rx="8" ry="10"/>
    <ellipse cx="145" cy="82" rx="8" ry="10"/>
    <ellipse cx="120" cy="80" rx="6" ry="8"/>
    <!-- Horizon/skyline -->
    <path d="M40 88 Q50 84 55 86 Q65 80 75 86 Q80 82 85 62" fill="#1a1a1a" stroke="none"/>
    <path d="M85 62 Q90 82 95 84 Q105 80 115 82 Q125 78 135 84 Q145 80 150 86 Q155 84 160 88" fill="#1a1a1a" stroke="none"/>
    <!-- Water/waves at bottom -->
    <path d="M45 108 Q55 106 65 108 Q75 110 85 108 Q95 106 105 108 Q115 110 125 108 Q135 106 145 108 Q150 110 155 108" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    <path d="M50 112 Q60 110 70 112 Q80 114 90 112 Q100 110 110 112 Q120 114 130 112 Q140 110 150 112" fill="none" stroke="#1a1a1a" stroke-width="0.8"/>
  </g>

  <!-- Stars -->
  <circle cx="42" cy="130" r="3" fill="#1a1a1a"/>
  <circle cx="158" cy="130" r="3" fill="#1a1a1a"/>

  <!-- Bottom ribbon/banner -->
  <path d="M30 170 Q35 162 50 165 L100 160 L150 165 Q165 162 170 170 L165 175 Q155 170 150 172 L100 168 L50 172 Q45 170 35 175 Z" fill="#1a1a1a" stroke="none"/>

  <!-- Bottom arc text (Tamil motto) -->
  <path id="bottomTextPath" d="M 30,105 A 80,80 0 0,0 170,105" fill="none"/>
  <text font-family="'Times New Roman', Georgia, serif" font-size="10" font-weight="600" fill="#1a1a1a" letter-spacing="1">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">VELLORE</textPath>
  </text>
</svg>